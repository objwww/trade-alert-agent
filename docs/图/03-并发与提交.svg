<svg aria-label="并发调查与状态提交｜关键时序" xmlns="http://www.w3.org/2000/svg" width="2000" height="1350" viewBox="0 0 2000 1350" role="img"><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#557aaf" /></marker></defs><rect x="0" y="0" width="2000" height="1350" fill="#ffffff" /><rect stroke-width="1.5" x="39" y="130" width="222" height="66" rx="9" fill="#edf5ff" stroke="#d5dfeb" /><rect stroke-width="1.5" x="319" y="130" width="222" height="66" rx="9" fill="#edf5ff" stroke="#d5dfeb" /><rect stroke-width="1.5" x="599" y="130" width="222" height="66" rx="9" fill="#edf5ff" stroke="#d5dfeb" /><rect stroke-width="1.5" x="879" y="130" width="222" height="66" rx="9" fill="#edf5ff" stroke="#d5dfeb" /><rect stroke-width="1.5" x="1159" y="130" width="222" height="66" rx="9" fill="#edf5ff" stroke="#d5dfeb" /><rect stroke-width="1.5" x="1439" y="130" width="222" height="66" rx="9" fill="#edf5ff" stroke="#d5dfeb" /><rect stroke-width="1.5" x="1719" y="130" width="222" height="66" rx="9" fill="#edf5ff" stroke="#d5dfeb" /><rect stroke-width="1.5" x="870" y="553" width="1080" height="286" rx="9" fill="#f6fbf8" stroke="#bad5c9" /><rect stroke-width="1.5" x="75" y="1164" width="1850" height="92" rx="9" fill="#fff8eb" stroke="#d7bd86" /><path stroke-width="1.8" stroke-dasharray="6 5" d="M150,196 L150,1144" fill="none" stroke="#b1becd" /><path stroke-width="1.8" stroke-dasharray="6 5" d="M430,196 L430,1144" fill="none" stroke="#b1becd" /><path stroke-width="1.8" stroke-dasharray="6 5" d="M710,196 L710,1144" fill="none" stroke="#b1becd" /><path stroke-width="1.8" stroke-dasharray="6 5" d="M990,196 L990,1144" fill="none" stroke="#b1becd" /><path stroke-width="1.8" stroke-dasharray="6 5" d="M1270,196 L1270,1144" fill="none" stroke="#b1becd" /><path stroke-width="1.8" stroke-dasharray="6 5" d="M1550,196 L1550,1144" fill="none" stroke="#b1becd" /><path stroke-width="1.8" stroke-dasharray="6 5" d="M1830,196 L1830,1144" fill="none" stroke="#b1becd" /><path stroke-width="1.8" d="M150,219 L430,219" fill="none" stroke="#557aaf" /><polygon points="430,219 421.0,223.0 421.0,215.0" fill="#557aaf" /><path stroke-width="1.8" d="M430,252 L710,252" fill="none" stroke="#557aaf" /><polygon points="710,252 701.0,256.0 701.0,248.0" fill="#557aaf" /><path stroke-width="1.8" d="M710,308 L430,308" fill="none" stroke="#557aaf" /><polygon points="430,308 439.0,304.0 439.0,312.0" fill="#557aaf" /><path stroke-width="1.8" d="M990,378 L710,378" fill="none" stroke="#557aaf" /><polygon points="710,378 719.0,374.0 719.0,382.0" fill="#557aaf" /><path stroke-width="1.8" d="M710,424 L990,424" fill="none" stroke="#557aaf" /><polygon points="990,424 981.0,428.0 981.0,420.0" fill="#557aaf" /><path stroke-width="1.8" d="M1270,476 L710,476" fill="none" stroke="#557aaf" /><polygon points="710,476 719.0,472.0 719.0,480.0" fill="#557aaf" /><path stroke-width="1.8" d="M710,522 L1270,522" fill="none" stroke="#557aaf" /><polygon points="1270,522 1261.0,526.0 1261.0,518.0" fill="#557aaf" /><path stroke-width="1.8" d="M990,625 L1550,625" fill="none" stroke="#557aaf" /><polygon points="1550,625 1541.0,629.0 1541.0,621.0" fill="#557aaf" /><path stroke-width="1.8" d="M990,681 L1550,681" fill="none" stroke="#557aaf" /><polygon points="1550,681 1541.0,685.0 1541.0,677.0" fill="#557aaf" /><path stroke-width="1.8" d="M1270,737 L1550,737" fill="none" stroke="#557aaf" /><polygon points="1550,737 1541.0,741.0 1541.0,733.0" fill="#557aaf" /><path stroke-width="1.8" d="M1550,806 L990,806" fill="none" stroke="#557aaf" /><polygon points="990,806 999.0,802.0 999.0,810.0" fill="#557aaf" /><path stroke-width="1.8" d="M990,893 L1830,893" fill="none" stroke="#557aaf" /><polygon points="1830,893 1821.0,897.0 1821.0,889.0" fill="#557aaf" /><path stroke-width="1.8" d="M1270,953 L1830,953" fill="none" stroke="#557aaf" /><polygon points="1830,953 1821.0,957.0 1821.0,949.0" fill="#557aaf" /><path stroke-width="1.8" d="M1830,1025 L710,1025" fill="none" stroke="#557aaf" /><polygon points="710,1025 719.0,1021.0 719.0,1029.0" fill="#557aaf" /><path stroke-width="1.8" d="M710,1094 L1830,1094" fill="none" stroke="#557aaf" /><polygon points="1830,1094 1821.0,1098.0 1821.0,1090.0" fill="#557aaf" /><text font-family="sans-serif" font-size="30" font-weight="700" text-anchor="start" x="45" y="47" fill="#173253">并发调查与状态提交｜关键时序</text><text font-family="sans-serif" font-size="15" font-weight="400" text-anchor="start" x="45" y="82" fill="#687991">目标一设计 0.1 · 两个 Run 并发；同 Run 的独立 Task 有界并行；逻辑调用与提交分离</text><text font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="150.0" y="159" fill="#173253">调用方／测试平台</text><text font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="430.0" y="159" fill="#173253">API 应用用例</text><text font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="710.0" y="159" fill="#173253">PostgreSQL</text><text font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="990.0" y="159" fill="#173253">Worker A／Run 甲</text><text font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="1270.0" y="159" fill="#173253">Worker B／Run 乙</text><text font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="1550.0" y="159" fill="#173253">Gateway／Evidence</text><text font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="1830.0" y="159" fill="#173253">StateCommitter</text><text font-family="sans-serif" font-size="17" font-weight="700" text-anchor="start" x="888" y="581" fill="#173253">并行区间｜先预留预算与槽位，再记录意图并派发</text><text font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="1000.0" y="1193" fill="#173253">取消、重规划、接管与迟到结果</text><text font-family="sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="1000.0" y="1219" fill="#52677f">当前资格失效则拒绝推进；原始材料按授权核验后可复用。远端请求未知需要核验，不承诺外部 exactly-once。</text><text font-family="sans-serif" font-size="15" font-weight="400" text-anchor="start" x="75" y="1310" fill="#52677f">时序仅示关键持久化边界；所有正式测试先在平台登记账号、中文功能、版本和证据，图中不是实际执行记录。</text><text font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start" x="162" y="214" fill="#557aaf">申请独立调查并保留发起身份</text><text font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start" x="442" y="242" fill="#557aaf">短事务：合法事件＋幂等键＋Run＋必要 Outbox</text><text font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start" x="442" y="298" fill="#557aaf">提交后返回调查标识；断连按原键查询</text><text font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start" x="722" y="368" fill="#557aaf">领取 Run 甲</text><text font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start" x="722" y="414" fill="#557aaf">Owner A＋Epoch＋Lease</text><text font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start" x="722" y="466" fill="#557aaf">领取 Run 乙（独立行与独立预算）</text><text font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start" x="722" y="512" fill="#557aaf">Owner B＋Epoch＋Lease</text><text font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start" x="1002" y="615" fill="#557aaf">Run 甲：指标取证 Task</text><text font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start" x="1002" y="671" fill="#557aaf">Run 甲：独立日志取证 Task</text><text font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start" x="1282" y="727" fill="#557aaf">Run 乙：独立取证</text><text font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start" x="1002" y="796" fill="#557aaf">READY 证据引用＋受控 Observation</text><text font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start" x="1002" y="883" fill="#557aaf">Run 甲各 Task 独立提交结果，不写共享消息列表</text><text font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start" x="1282" y="943" fill="#557aaf">Run 乙结果保持独立归属</text><text font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start" x="722" y="1015" fill="#557aaf">短事务：核验 Owner／Epoch／Attempt／计划成员与版本，提交结果</text><text font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start" x="722" y="1084" fill="#557aaf">同键同摘要返回原结果；普通版本冲突重读合并</text></svg>