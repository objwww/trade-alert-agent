<svg aria-label="业务场景与调查契约｜领域关系与一致性边界" xmlns="http://www.w3.org/2000/svg" width="1800" height="1260" viewBox="0 0 1800 1260" role="img"><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#557aaf" /></marker></defs><rect x="0" y="0" width="1800" height="1260" fill="#ffffff" /><rect stroke-width="1.5" x="75" y="170" width="345" height="122" rx="9" fill="#edf5ff" stroke="#d5dfeb" /><rect stroke-width="1.5" x="495" y="170" width="345" height="122" rx="9" fill="#edf5ff" stroke="#d5dfeb" /><rect stroke-width="1.5" x="915" y="170" width="345" height="122" rx="9" fill="#edf5ff" stroke="#d5dfeb" /><rect stroke-width="1.5" x="1335" y="170" width="345" height="122" rx="9" fill="#edf5ff" stroke="#d5dfeb" /><rect stroke-width="1.5" x="75" y="420" width="345" height="136" rx="9" fill="#eef8f5" stroke="#d5dfeb" /><rect stroke-width="1.5" x="495" y="420" width="345" height="136" rx="9" fill="#eef8f5" stroke="#d5dfeb" /><rect stroke-width="1.5" x="915" y="420" width="345" height="136" rx="9" fill="#eef8f5" stroke="#d5dfeb" /><rect stroke-width="1.5" x="1335" y="420" width="345" height="136" rx="9" fill="#eef8f5" stroke="#d5dfeb" /><rect stroke-width="1.5" x="75" y="710" width="345" height="136" rx="9" fill="#fff8eb" stroke="#d5dfeb" /><rect stroke-width="1.5" x="495" y="710" width="345" height="136" rx="9" fill="#fff8eb" stroke="#d5dfeb" /><rect stroke-width="1.5" x="915" y="710" width="345" height="136" rx="9" fill="#fff8eb" stroke="#d5dfeb" /><rect stroke-width="1.5" x="1335" y="710" width="345" height="136" rx="9" fill="#fff8eb" stroke="#d5dfeb" /><rect stroke-width="1.5" x="495" y="1015" width="765" height="113" rx="9" fill="#f1edff" stroke="#b3a2d9" /><path stroke-width="1.8" d="M420,230 L495,230" fill="none" stroke="#557aaf" /><polygon points="495,230 486.0,234.0 486.0,226.0" fill="#557aaf" /><path stroke-width="1.8" d="M840,230 L915,230" fill="none" stroke="#557aaf" /><polygon points="915,230 906.0,234.0 906.0,226.0" fill="#557aaf" /><path stroke-width="1.8" d="M1260,230 L1335,230" fill="none" stroke="#557aaf" /><polygon points="1335,230 1326.0,234.0 1326.0,226.0" fill="#557aaf" /><path stroke-width="1.8" d="M667,292 L667,345 L247,345 L247,420" fill="none" stroke="#557aaf" /><polygon points="247,420 243.0,411.0 251.0,411.0" fill="#557aaf" /><path stroke-width="1.8" d="M1087,292 L1087,375 L667,375 L667,420" fill="none" stroke="#557aaf" /><polygon points="667,420 663.0,411.0 671.0,411.0" fill="#557aaf" /><path stroke-width="1.8" d="M840,490 L915,490" fill="none" stroke="#557aaf" /><polygon points="915,490 906.0,494.0 906.0,486.0" fill="#557aaf" /><path stroke-width="1.8" d="M1260,490 L1335,490" fill="none" stroke="#557aaf" /><polygon points="1335,490 1326.0,494.0 1326.0,486.0" fill="#557aaf" /><path stroke-width="1.8" d="M420,778 L495,778" fill="none" stroke="#557aaf" /><polygon points="495,778 486.0,782.0 486.0,774.0" fill="#557aaf" /><path stroke-width="1.8" d="M840,778 L915,778" fill="none" stroke="#557aaf" /><polygon points="915,778 906.0,782.0 906.0,774.0" fill="#557aaf" /><path stroke-width="1.8" d="M1507,710 L1507,556" fill="none" stroke="#557aaf" /><polygon points="1507,556 1511.0,565.0 1503.0,565.0" fill="#557aaf" /><path stroke-width="1.8" d="M1507,846 L1507,944 L877,944 L877,1015" fill="none" stroke="#557aaf" /><polygon points="877,1015 873.0,1006.0 881.0,1006.0" fill="#557aaf" /><path stroke-width="1.8" stroke-dasharray="6 5" d="M1087,846 L1087,888 L450,888 L450,315 L667,315 L667,292" fill="none" stroke="#557aaf" /><polygon points="667,292 671.0,301.0 663.0,301.0" fill="#557aaf" /><text font-family="sans-serif" font-size="30" font-weight="700" text-anchor="start" x="45" y="47" fill="#173253">业务场景与调查契约｜领域关系与一致性边界</text><text font-family="sans-serif" font-size="15" font-weight="400" text-anchor="start" x="45" y="82" fill="#687991">目标一设计 0.1 · 关联基数图 · 连线表达引用关系，不表示远程调用</text><text font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="247.5" y="199" fill="#173253">Incident 事件</text><text font-family="sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="247.5" y="225" fill="#52677f">业务异常 / 告警关联</text><text font-family="sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="247.5" y="248" fill="#52677f">公开编号 / 显式选择报告</text><text font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="667.5" y="199" fill="#173253">InvestigationRun 调查</text><text font-family="sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="667.5" y="225" fill="#52677f">生命周期＋阶段＋独立结论</text><text font-family="sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="667.5" y="248" fill="#52677f">预算 / Owner / Epoch / 版本</text><text font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="1087.5" y="199" fill="#173253">InvestigationTask 任务</text><text font-family="sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="1087.5" y="225" fill="#52677f">不可变目标 / 范围 / 完成标准</text><text font-family="sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="1087.5" y="248" fill="#52677f">Ready 资格动态计算</text><text font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="1507.5" y="199" fill="#173253">TaskAttempt 执行尝试</text><text font-family="sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="1507.5" y="225" fill="#52677f">每次重试与接管有独立身份</text><text font-family="sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="1507.5" y="248" fill="#52677f">旧尝试不恢复执行权</text><text font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="247.5" y="449" fill="#173253">PlanRevision／Membership</text><text font-family="sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="247.5" y="475" fill="#52677f">不可变 DAG 及有效任务集合</text><text font-family="sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="247.5" y="498" fill="#52677f">可沿用旧任务，不只比创建版本</text><text font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="667.5" y="449" fill="#173253">TaskExecutionResult</text><text font-family="sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="667.5" y="475" fill="#52677f">执行状态 / 覆盖 / 假设结论</text><text font-family="sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="667.5" y="498" fill="#52677f">同键同内容幂等提交</text><text font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="1087.5" y="449" fill="#173253">Finding 调查发现</text><text font-family="sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="1087.5" y="475" fill="#52677f">命题 / 支持 / 反证 / 缺口</text><text font-family="sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="1087.5" y="498" fill="#52677f">有引用不等于因果成立</text><text font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="1507.5" y="449" fill="#173253">Evidence 原始证据</text><text font-family="sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="1507.5" y="475" fill="#52677f">来源 / 窗口 / 完整性 / READY</text><text font-family="sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="1507.5" y="498" fill="#52677f">精确 locator 与当前读取授权</text><text font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="247.5" y="739" fill="#173253">ScenarioVersion 场景版本</text><text font-family="sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="247.5" y="765" fill="#52677f">中文场景 / 条件 / 证据要求</text><text font-family="sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="247.5" y="788" fill="#52677f">模型不可读评测真值</text><text font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="667.5" y="739" fill="#173253">FaultTrigger 故障触发</text><text font-family="sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="667.5" y="765" fill="#52677f">申请 / 执行 / 效果 / 独立恢复</text><text font-family="sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="667.5" y="788" fill="#52677f">注入完成不等于业务恢复</text><text font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="1087.5" y="739" fill="#173253">TestRun 测试记录</text><text font-family="sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="1087.5" y="765" fill="#52677f">发起 / 执行账号 / 中文功能</text><text font-family="sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="1087.5" y="788" fill="#52677f">关联故障、调查、截图及判定</text><text font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="1507.5" y="739" fill="#173253">ReviewResult／ReviewIssue</text><text font-family="sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="1507.5" y="765" fill="#52677f">绑定候选与被审状态版本</text><text font-family="sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="1507.5" y="788" fill="#52677f">审核决定 / 反证 / 补证缺口</text><text font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="877.5" y="1044" fill="#173253">RCAReport／Incident.selectedReportRef</text><text font-family="sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="877.5" y="1070" fill="#52677f">报告按 Run 独立保留；当前报告通过授权命令与 Incident 版本选择</text><text font-family="sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="877.5" y="1093" fill="#52677f">不采用多个 Run 最后写入覆盖；根因接受、受控验证、业务恢复分开</text><text font-family="sans-serif" font-size="15" font-weight="400" text-anchor="start" x="75" y="1180" fill="#52677f">必要短事务：Task 状态＋正式结果＋Finding 关联＋Run 版本共同提交；外部 Evidence 大对象另有 PENDING → READY 边界。</text><text font-family="sans-serif" font-size="15" font-weight="400" text-anchor="start" x="75" y="1215" fill="#52677f">Cardinality 为概念关联：正式物理表、索引、保留期限及容量在后续目标验证；Note／Context 是可重建投影，不替代上述真源。</text><text font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start" x="438" y="219" fill="#557aaf">1:0..N</text><text font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start" x="858" y="219" fill="#557aaf">1:0..N</text><text font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start" x="1278" y="219" fill="#557aaf">1:0..N</text><text font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start" x="366" y="336" fill="#557aaf">1:0..N 计划版本</text><text font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start" x="727" y="367" fill="#557aaf">任务的正式结果</text><text font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start" x="855" y="478" fill="#557aaf">0:N</text><text font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start" x="1280" y="478" fill="#557aaf">引用</text><text font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start" x="437" y="766" fill="#557aaf">1:0..N</text><text font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start" x="857" y="766" fill="#557aaf">关联</text><text font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start" x="1520" y="642" fill="#557aaf">核对原文</text><text font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start" x="1010" y="935" fill="#557aaf">报告接受条件与未解决缺口</text><text font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start" x="470" y="880" fill="#557aaf">关联 Run，独立于调查结论</text></svg>