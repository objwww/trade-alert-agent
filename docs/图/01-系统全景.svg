="none" stroke="#557aaf" /><polygon points="900,1085 896.0,1076.0 904.0,1076.0" fill="#557aaf" /><path stroke-width="1.8" d="M900,960 L900,977 L1330,977 L1330,1085" fill="none" stroke="#557aaf" /><polygon points="1330,1085 1326.0,1076.0 1334.0,1076.0" fill="#557aaf" /><path stroke-width="1.8" d="M1520,751 L1540,751 L1540,1045 L1460,1045 L1460,1085" fill="none" stroke="#557aaf" /><polygon points="1460,1085 1456.0,1076.0 1464.0,1076.0" fill="#557aaf" /><path stroke-width="1.8" d="M660,1155 L710,1155" fill="none" stroke="#557aaf" /><polygon points="710,1155 701.0,1159.0 701.0,1151.0" fill="#557aaf" /><text font-family="sans-serif" font-size="30" font-weight="700" text-anchor="start" x="45" y="47" fill="#173253">谷粒商城 RCA 调查平台｜系统全景</text><text font-family="sans-serif" font-size="15" font-weight="400" text-anchor="start" x="45" y="82" fill="#687991">目标一设计 0.1 · 逻辑协作图 · 2026-11-02 · 组件为规划能力，不代表已部署</text><text font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="900.0" y="159" fill="#173253">工作台与触发入口（目标四／五／十二）</text><text font-family="sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="900.0" y="185" fill="#52677f">监控与告警  ·  调查详情与报告  ·  故障实验  ·  测试记录与评测</text><text font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="900.0" y="321" fill="#173253">接口与应用用例</text><text font-family="sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="900.0" y="347" fill="#52677f">可信身份提取  /  请求校验  /  创建与取消调查  /  选择报告  /  查询证据与测试记录</text><text font-family="sans-serif" font-size="17" font-weight="700" text-anchor="start" x="268" y="470" fill="#173253">RCA 调查内核｜同一模块化单体内的逻辑模块</text><text font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="900.0" y="522" fill="#173253">Harness 运行控制</text><text font-family="sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="900.0" y="548" fill="#52677f">有效 Owner  /  原子预算  /  状态版本  /  权限  /  终止与恢复</text><text font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="420.0" y="632" fill="#173253">Planner ＋ PlanValidator</text><text font-family="sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="420.0" y="658" fill="#52677f">任务目标 / 合法 DAG / 增量计划</text><text font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="740.0" y="632" fill="#173253">Task Scheduler</text><text font-family="sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="740.0" y="658" fill="#52677f">依赖解析 / 有界并发 / Attempt</text><text font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="1060.0" y="632" fill="#173253">ReAct ／按需 Specialist</text><text font-family="sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="1060.0" y="658" fill="#52677f">局部取证 / 结构化结果</text><text font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="1380.0" y="632" fill="#173253">独立 Reviewer</text><text font-family="sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="1380.0" y="658" fill="#52677f">支持 / 反证 / 因果缺口</text><text font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="580.0" y="756" fill="#173253">ContextManager／调查笔记</text><text font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="1220.0" y="756" fill="#173253">StateCommitter／Checkpoint／调用账本</text><text font-family="sans-serif" font-size="17" font-weight="700" text-anchor="start" x="48" y="470" fill="#173253">执行治理</text><text font-family="sans-serif" font-size="17" font-weight="700" text-anchor="start" x="49" y="512" fill="#173253">可信身份</text><text font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start" x="49" y="539" fill="#52677f">租户 / 环境 / 委托</text><text font-family="sans-serif" font-size="17" font-weight="700" text-anchor="start" x="49" y="592" fill="#173253">最小权限</text><text font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start" x="49" y="619" fill="#52677f">任务范围 / 当前授权</text><text font-family="sans-serif" font-size="17" font-weight="700" text-anchor="start" x="49" y="672" fill="#173253">并发与预算</text><text font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start" x="49" y="699" fill="#52677f">Run / Worker / 租户</text><text font-family="sans-serif" font-size="17" font-weight="700" text-anchor="start" x="49" y="752" fill="#173253">版本与执行权</text><text font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start" x="49" y="779" fill="#52677f">Lease / Epoch / CAS</text><text font-family="sans-serif" font-size="17" font-weight="700" text-anchor="start" x="49" y="832" fill="#173253">超时与取消</text><text font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start" x="49" y="859" fill="#52677f">停止派发 / 迟到拦截</text><text font-family="sans-serif" font-size="17" font-weight="700" text-anchor="start" x="49" y="912" fill="#173253">审计与保留</text><text font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start" x="49" y="939" fill="#52677f">来源 / 脱敏 / 生命周期</text><text font-family="sans-serif" font-size="17" font-weight="700" text-anchor="start" x="1593" y="470" fill="#173253">测试与运行保障</text><text font-family="sans-serif" font-size="17" font-weight="700" text-anchor="start" x="1593" y="512" fill="#173253">测试先登记</text><text font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start" x="1593" y="539" fill="#52677f">账号 / 功能 / 版本</text><text font-family="sans-serif" font-size="17" font-weight="700" text-anchor="start" x="1593" y="592" fill="#173253">故障独立恢复</text><text font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start" x="1593" y="619" fill="#52677f">目标 / 回执 / 核验</text><text font-family="sans-serif" font-size="17" font-weight="700" text-anchor="start" x="1593" y="672" fill="#173253">真值隔离</text><text font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start" x="1593" y="699" fill="#52677f">不向被测 Agent 泄漏</text><text font-family="sans-serif" font-size="17" font-weight="700" text-anchor="start" x="1593" y="752" fill="#173253">质量评测</text><text font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start" x="1593" y="779" fill="#52677f">证据 / 定位 / 安全</text><text font-family="sans-serif" font-size="17" font-weight="700" text-anchor="start" x="1593" y="832" fill="#173253">平台自观测</text><text font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start" x="1593" y="859" fill="#52677f">失联 / 积压 / 降级</text><text font-family="sans-serif" font-size="17" font-weight="700" text-anchor="start" x="1593" y="912" fill="#173253">设计先确认</text><text font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start" x="1593" y="939" fill="#52677f">Vue 实现遵守原规则</text><text font-family="sans-serif" font-size="17" font-weight="700" text-anchor="start" x="268" y="876" fill="#173253">基础设施适配边界</text><text font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="470.0" y="924" fill="#173253">Tool Gateway／数据源 Adapter</text><text font-family="sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="470.0" y="950" fill="#52677f">HTTP／可选 MCP；执行前授权与限额</text><text font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="900.0" y="924" fill="#173253">Evidence Store／精确片段加载</text><text font-family="sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="900.0" y="950" fill="#52677f">原始结果保存；按 locator 授权读取</text><text font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="1330.0" y="924" fill="#173253">模型适配（Spring AI）</text><text font-family="sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="1330.0" y="950" fill="#52677f">由 Executor 调用；凭据不进入 Prompt</text><text font-family="sans-serif" font-size="17" font-weight="700" text-anchor="start" x="268" y="1060" fill="#173253">靶场、观测系统与独立调查存储</text><text font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="470.0" y="1114" fill="#173253">谷粒商城隔离靶场</text><text font-family="sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="470.0" y="1140" fill="#52677f">订单 / 库存 / 网关 / 消费角色</text><text font-family="sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="470.0" y="1163" fill="#52677f">业务 MySQL / Redis / RabbitMQ</text><text font-family="sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="470.0" y="1186" fill="#52677f">保留兼容技术栈；依目标二实际核实</text><text font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="900.0" y="1114" fill="#173253">观测与资源目录</text><text font-family="sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="900.0" y="1140" fill="#52677f">指标 / 日志 / Trace / 变更</text><text font-family="sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="900.0" y="1163" fill="#52677f">历史与当前服务—容器—主机映射</text><text font-family="sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="900.0" y="1186" fill="#52677f">源系统 / 有效期 / 完整性</text><text font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="1330.0" y="1114" fill="#173253">RCA PostgreSQL 控制面</text><text font-family="sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="1330.0" y="1140" fill="#52677f">Run / Task / Attempt / 计划与结果</text><text font-family="sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="1330.0" y="1163" fill="#52677f">账本 / 审计 / Evidence 元数据</text><text font-family="sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="1330.0" y="1186" fill="#52677f">有界快照；大对象存储按需扩展</text><text font-family="sans-serif" font-size="15" font-weight="400" text-anchor="start" x="45" y="1305" fill="#52677f">图例：箭头表示运行时调用或数据交付；侧栏为横切约束；不表示源码依赖或已部署服务数量。</text><text font-family="sans-serif" font-size="15" font-weight="400" text-anchor="start" x="45" y="1338" fill="#52677f">源码依赖：interfaces → application → domain；infrastructure → 内层端口；bootstrap 仅装配。RCA 与商城业务库独立。</text><text font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start" x="916" y="269" fill="#557aaf">创建／查询／取消</text><text font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start" x="917" y="423" fill="#557aaf">授权后的应用命令</text><text font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start" x="890" y="572" fill="#557aaf">经 Harness 判定且有预算：Planner 生成补证计划</text><text font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start" x="488" y="832" fill="#557aaf">受控查询意图</text><text font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start" x="670" y="915" fill="#557aaf">存证</text><text font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start" x="490" y="985" fill="#557aaf">查询授权数据</text><text font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start" x="1115" y="969" fill="#557aaf">内容与元数据</text><text font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start" x="1430" y="1026" fill="#557aaf">状态提交</text></svg>